[package]
name = "ev-control-gui"
version = "1.5.7"
edition = "2021"
description = "EV Prototype Control Center - Windows GUI with FSD"
authors = ["Texas A&M FLiNT - Team Autopilot"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = "0.25"
serialport = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
directories = "5.0"
chrono = "0.4"

# FSD/Navigation
pathfinding = "4.0"

# Camera support - escapi is Windows-only, simple DirectShow wrapper
[target.'cfg(windows)'.dependencies]
escapi = "4.0"

[profile.release]
opt-level = 3
lto = true
strip = true
