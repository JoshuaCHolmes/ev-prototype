name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Linux TUI
        run: |
          cd rust-controller
          cargo build --release
          mv target/release/ev-control ../ev-control-tui-linux
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-control-tui-linux
          path: ev-control-tui-linux

  build-windows-tui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Windows TUI
        run: |
          cd rust-controller
          cargo build --release
          move target\release\ev-control.exe ..\ev-control-tui.exe
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-control-tui-windows
          path: ev-control-tui.exe

  build-windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Windows GUI
        run: |
          cd gui-controller
          cargo build --release
          move target\release\ev-control-gui.exe ..\ev-control-gui.exe
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-control-gui-windows
          path: ev-control-gui.exe

  build-linux-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev libssl-dev
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Linux GUI
        run: |
          cd gui-controller
          cargo build --release
          mv target/release/ev-control-gui ../ev-control-gui-linux
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-control-gui-linux
          path: ev-control-gui-linux

  release:
    needs: [build-linux-tui, build-windows-tui, build-windows-gui, build-linux-gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ev-control-tui-linux/ev-control-tui-linux
            ev-control-tui-windows/ev-control-tui.exe
            ev-control-gui-windows/ev-control-gui.exe
            ev-control-gui-linux/ev-control-gui-linux
            scripts/attach-usb-wsl.bat
            scripts/ev-control.bat
          body: |
            ## EV Prototype Control Center
            
            ### Downloads
            - `ev-control-gui.exe` - **Windows GUI** (recommended)
            - `ev-control-gui-linux` - Linux GUI
            - `ev-control-tui.exe` - Windows TUI (terminal)
            - `ev-control-tui-linux` - Linux TUI (terminal)
            - `attach-usb-wsl.bat` - USB attach script for WSL users
            
            ### GUI Version
            Full graphical interface with:
            - Real OpenStreetMap display
            - Camera feed (ASCII style)
            - Vehicle controls and gauges
            - Status logs
            
            ### TUI Version
            Terminal-based interface for headless/SSH usage.
            
            ### Controls
            Hold W/A/S/D to drive, SPACE for e-brake, Q to quit.
